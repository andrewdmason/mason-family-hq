name: iOS apps

# Builds the family iOS apps and runs their tests on a simulator whenever they
# change. Agents working in the cloud have no Xcode, so this is where their
# Swift is first compiled. Add each new app's scheme to the matrix. The Mac
# versions of Tuttles and Calendar are built as well (no tests of their own).
on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      matrix:
        app: [Practice, MusicMinusOne, Tuttles, Workouts, Calendar]
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild -project MasonApps.xcodeproj -scheme "${{ matrix.app }}" \
            -destination "id=$SIM" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO test

  # Tuttles and Calendar on the Mac share most of their code with the iPhone
  # apps (ios/Tuttles/Shared, ios/Calendar/Shared), so a change made for the
  # phone is compiled for the Mac here too.
  mac:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      matrix:
        app: [TuttlesMac, CalendarMac]
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project MasonApps.xcodeproj -scheme "${{ matrix.app }}" \
            -destination "platform=macOS" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build
