name: iOS apps

# Builds the family iOS apps and runs their tests on a simulator whenever they
# change. Agents working in the cloud have no Xcode, so this is where their
# Swift is first compiled. Add each new app's scheme to the matrix.
on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      matrix:
        app: [Practice, MusicMinusOne, Reader]
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild -project MasonApps.xcodeproj -scheme "${{ matrix.app }}" \
            -destination "id=$SIM" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO test
