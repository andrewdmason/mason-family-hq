name: MasonOS iOS

# Builds the iOS app and runs its tests on a simulator whenever it changes.
# Agents working in the cloud have no Xcode, so this is where their Swift is
# first compiled.
on:
  pull_request:
    paths: ["ios/MasonOS/**", ".github/workflows/ios-masonos.yml"]
  push:
    branches: [main]
    paths: ["ios/MasonOS/**", ".github/workflows/ios-masonos.yml"]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/MasonOS
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild -project MasonOS.xcodeproj -scheme MasonOS \
            -destination "id=$SIM" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO test
