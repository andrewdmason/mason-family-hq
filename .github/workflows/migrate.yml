name: Run Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  # A migration that failed for a reason outside the SQL — a broken CLI release,
  # an expired token — can't be retried by pushing, because the path filter above
  # only fires on a migration change. This lets the same run be kicked off by hand
  # once the cause is fixed, instead of landing an empty migration to trigger it.
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest". On 2026-08-07 the CLI's own auto-updated release
          # broke this job with no change on our side: v2.112.0 (part of their Go →
          # TypeScript port) validates the api-keys API response strictly and rejects
          # one of this project's key timestamps for not ending in "Z", so `link`
          # exits 1 before any SQL runs. The app had already deployed against the new
          # schema, so the reader's quiz pages 404'd until the column landed.
          # Bump this deliberately, after checking a migration still pushes.
          version: 2.111.0

      - run: supabase link --project-ref $SUPABASE_PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
