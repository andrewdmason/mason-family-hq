name: Run Supabase Migrations

# Manual only. Production migrations are applied by the deploy itself — the first
# step of the production build, before `next build` (scripts/deploy-migrate.mjs) —
# so the app can never ship ahead of its schema. This used to run on every push to
# main, which meant two systems reacting to the same commit with no ordering between
# them: on 2026-08-07 this job failed and Vercel deployed anyway, taking the reader's
# quiz pages down. Leaving the push trigger in place now would be worse than useless:
# two `db push` runs racing the same pending migration.
#
# Kept as the recovery lever for the case the deploy can't cover — applying a
# migration without shipping a build, or re-running one after fixing the cause of a
# failure. Run it with: gh workflow run migrate.yml --ref main
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest". On 2026-08-07 the CLI's own auto-updated release
          # broke this job with no change on our side: v2.112.0 (part of their Go →
          # TypeScript port) validates the api-keys API response strictly and rejects
          # one of this project's key timestamps for not ending in "Z", so `link`
          # exits 1 before any SQL runs. The app had already deployed against the new
          # schema, so the reader's quiz pages 404'd until the column landed.
          # Bump this deliberately, after checking a migration still pushes.
          version: 2.111.0

      - run: supabase link --project-ref $SUPABASE_PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
