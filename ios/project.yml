# The family apps, native: one app per job, like the website's home-screen
# apps, all built from this one project on the shared MasonKit package
# (Packages/MasonKit: Supabase, sign-in, theme). Generate the Xcode project with
# `xcodegen` from this folder (the .xcodeproj is gitignored); see README.md for
# build and install steps.
name: MasonApps
options:
  bundleIdPrefix: io.mason
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S4AV4J8F99
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MasonKit:
    path: Packages/MasonKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
targets:
  # Practice: Andrew's quick log, with a Live Activity.
  Practice:
    type: application
    platform: iOS
    sources: [Practice/App, Practice/Shared]
    dependencies:
      - package: MasonKit
      - package: Supabase
        product: Supabase
      - target: PracticeWidgets
    entitlements:
      path: Practice/App/Practice.entitlements
      properties:
        # Shared with the widget extension: the running practice timer.
        com.apple.security.application-groups: [group.io.mason.practice]
        # Shared by every family app: one sign-in for all of them (MasonKit's
        # Config.sharedKeychainGroup).
        keychain-access-groups: [$(AppIdentifierPrefix)io.mason.shared]
    info:
      path: Practice/App/Info.plist
      properties:
        CFBundleDisplayName: Practice
        CFBundleURLTypes:
          - CFBundleURLName: io.mason.practice
            CFBundleURLSchemes: [io.mason.practice]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mason.practice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    scheme:
      testTargets: [PracticeTests]
  # The practice timer's Live Activity (Lock Screen and Dynamic Island).
  PracticeWidgets:
    type: app-extension
    platform: iOS
    sources: [Practice/Widgets, Practice/Shared]
    entitlements:
      path: Practice/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.io.mason.practice]
    info:
      path: Practice/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Practice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mason.practice.widgets
        TARGETED_DEVICE_FAMILY: "1"
        # Shared/ code that only the app can run (the Stop button's write)
        # is behind `#if !WIDGET_EXTENSION`.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
  PracticeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Practice/Tests]
    dependencies:
      - target: Practice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  # Music Minus One: play along with recordings whose instruments are separate
  # tracks, muting your own part. Andrew's, installed straight to his phone.
  MusicMinusOne:
    type: application
    platform: iOS
    sources:
      - path: MusicMinusOne/App
        excludes: [Stretch/StretchBridge.cpp]
      # The stretcher is optimized even in Debug (the phone installs run
      # Debug), or it can't keep up in real time.
      - path: MusicMinusOne/App/Stretch/StretchBridge.cpp
        compilerFlags: [-O3]
      - path: MusicMinusOne/Vendor
        buildPhase: none
    dependencies:
      - package: MasonKit
      - package: Supabase
        product: Supabase
    entitlements:
      path: MusicMinusOne/App/MusicMinusOne.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)io.mason.shared]
    info:
      path: MusicMinusOne/App/Info.plist
      properties:
        CFBundleDisplayName: Music Minus One
        CFBundleURLTypes:
          - CFBundleURLName: io.mason.music-minus-one
            CFBundleURLSchemes: [io.mason.music-minus-one]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Keeps playing with the screen locked.
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mason.music-minus-one
        # Signalsmith Stretch (Vendor/) through a small C bridge, on Apple's FFT.
        SWIFT_OBJC_BRIDGING_HEADER: MusicMinusOne/App/MusicMinusOne-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) SIGNALSMITH_USE_ACCELERATE=1
        OTHER_LDFLAGS: $(inherited) -framework Accelerate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    scheme:
      testTargets: [MusicMinusOneTests]
  MusicMinusOneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MusicMinusOne/Tests]
    dependencies:
      - target: MusicMinusOne
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  # Reader: the website's Reader as an iPhone and iPad app. The shelf, offline
  # copies, listening and the Share menu are native; the reading screen and the
  # rarely used pages are the website in a web view.
  Reader:
    type: application
    platform: iOS
    sources: [Reader/App]
    dependencies:
      - package: MasonKit
      - package: Supabase
        product: Supabase
      - target: ReaderShare
    entitlements:
      path: Reader/App/Reader.entitlements
      properties:
        # Shared with the Share extension.
        com.apple.security.application-groups: [group.io.mason.reader]
        keychain-access-groups: [$(AppIdentifierPrefix)io.mason.shared]
    info:
      path: Reader/App/Info.plist
      properties:
        CFBundleDisplayName: Reader
        CFBundleURLTypes:
          - CFBundleURLName: io.mason.reader
            CFBundleURLSchemes: [io.mason.reader]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Keeps reading aloud with the screen locked or in another app.
        UIBackgroundModes: [audio]
        # The web views run the website's service worker (its offline copies
        # of books), which WebKit allows only on app-bound domains.
        WKAppBoundDomains: [family.mason.io]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mason.reader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    scheme:
      testTargets: [ReaderTests]
  # Reader in the Share menu: a web page becomes an article, an EPUB a book.
  ReaderShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Reader/Share
        excludes: [GetArticle.js]
      # Built from extension/ (npm run build there).
      - path: Reader/Share/GetArticle.js
        buildPhase: resources
    dependencies:
      - package: MasonKit
      - package: Supabase
        product: Supabase
    entitlements:
      path: Reader/Share/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.io.mason.reader]
        keychain-access-groups: [$(AppIdentifierPrefix)io.mason.shared]
    info:
      path: Reader/Share/Info.plist
      properties:
        CFBundleDisplayName: Reader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Safari runs it in the page and hands over the extracted article.
            NSExtensionJavaScriptPreprocessingFile: GetArticle
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $a,
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              || ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "org.idpf.epub-container"
              ).@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mason.reader.share
        TARGETED_DEVICE_FAMILY: "1,2"
  ReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Reader/Tests]
    dependencies:
      - target: Reader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
