# Clips Camera — the native capture companion to Baseball Clips.
# Generate the Xcode project with `xcodegen` from this folder (the .xcodeproj
# is gitignored); see README.md for build and install steps.
name: ClipsCamera
options:
  bundleIdPrefix: io.mason
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S4AV4J8F99
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Watch-only Clips for anyone not signed in; scripts/release.sh passes the
    # key from the database. Empty means everyone has to sign in.
    CLIPS_VIEWER_KEY: ""
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
targets:
  ClipsCamera:
    type: application
    platform: iOS
    sources: [ClipsCamera]
    dependencies:
      - package: Supabase
        product: Supabase
      - target: ClipsShare
    entitlements:
      path: ClipsCamera/ClipsCamera.entitlements
      properties:
        # Shared with the share extension: its Inbox of shared videos.
        com.apple.security.application-groups: [group.io.mason.clipscamera]
    info:
      path: ClipsCamera/Info.plist
      properties:
        CFBundleDisplayName: Clips Camera
        # The share extension opens the app with io.mason.clipscamera://import.
        CFBundleURLTypes:
          - CFBundleURLName: io.mason.clipscamera
            CFBundleURLSchemes: [io.mason.clipscamera]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ClipsViewerKey: $(CLIPS_VIEWER_KEY)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Clips Camera films your kid's at-bats.
        NSMicrophoneUsageDescription: At-bats are recorded with sound (it's muted during slow-motion replays).
        NSPhotoLibraryAddUsageDescription: Finished at-bats are saved to Photos while the app is being tested.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mason.clipscamera
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    scheme:
      testTargets: [ClipsCameraTests, ClipsCameraUITests]
  # "Baseball Clips" in the share sheet: hands a GameChanger video to the app.
  ClipsShare:
    type: app-extension
    platform: iOS
    sources: [ClipsShare]
    entitlements:
      path: ClipsShare/ClipsShare.entitlements
      properties:
        com.apple.security.application-groups: [group.io.mason.clipscamera]
    info:
      path: ClipsShare/Info.plist
      properties:
        CFBundleDisplayName: Baseball Clips
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Any share with a video in it. GameChanger sends its clip with a
            # line of text ("Follow … on GameChanger"), which the plain
            # "movies only" rule refuses.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $a,
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie").@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mason.clipscamera.share
        TARGETED_DEVICE_FAMILY: "1"
  ClipsCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ClipsCameraTests]
    dependencies:
      - target: ClipsCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  ClipsCameraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ClipsCameraUITests]
    dependencies:
      - target: ClipsCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
