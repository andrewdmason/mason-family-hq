<!-- Practice app icon source: the website Practice icon (src/app/practice/icon0.svg) inside a stopwatch. Render to Assets.xcassets/AppIcon.appiconset/icon-1024.png at 1024x1024 (iOS rounds the corners). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8475a6"/>
      <stop offset="1" stop-color="#524673"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g fill="none" stroke="#f7f1e5" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <!-- stopwatch: crown, side button, case -->
    <line x1="452" y1="170" x2="572" y2="170"/>
    <line x1="512" y1="170" x2="512" y2="270"/>
    <line x1="745" y1="330" x2="790" y2="285"/>
    <circle cx="512" cy="590" r="300"/>
  </g>
  <!-- the website's Practice symbol (lucide "music") -->
  <g transform="translate(338 426) scale(14.5)" fill="none" stroke="#f7f1e5" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
  </g>
</svg>
